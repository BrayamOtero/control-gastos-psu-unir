<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del gasto</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="pagina-formulario">
    <h1>Detalle del gasto</h1>

    <p id="estado" role="status" aria-live="polite">Cargando gasto…</p>

    <section id="detalle" class="tarjeta" hidden>
      <dl class="detalle-gasto">
        <div><dt>Fecha</dt><dd id="fecha"></dd></div>
        <div><dt>Importe</dt><dd id="importe" class="importe-detalle"></dd></div>
        <div><dt>Categoría</dt><dd id="categoria"></dd></div>
        <div><dt>Descripción</dt><dd id="descripcion"></dd></div>
      </dl>
    </section>

    <div class="acciones">
      <a id="editar" class="boton" hidden>Editar</a>
      <a id="volver" class="boton secundario" href="{{ url_for('index') }}">
        Volver al listado
      </a>
    </div>
  </main>

  <script>
    const gastoUrl = {{ url_for('obtener_gasto', gasto_id=gasto_id) | tojson }};
    const editarUrl = {{ url_for('editar_gasto', gasto_id=gasto_id) | tojson }};
    const listadoUrl = {{ url_for('index') | tojson }};
    const estado = document.querySelector("#estado");
    const detalle = document.querySelector("#detalle");
    const editar = document.querySelector("#editar");

    const filtros = new URLSearchParams();
    const actuales = new URLSearchParams(window.location.search);
    for (const nombre of ["mes", "categoria", "q"]) {
      const valor = actuales.get(nombre);
      if (valor) filtros.set(nombre, valor);
    }
    const sufijo = filtros.toString() ? `?${filtros}` : "";
    document.querySelector("#volver").href = listadoUrl + sufijo;

    async function cargarGasto() {
      try {
        const respuesta = await fetch(gastoUrl, {
          headers: { Accept: "application/json" },
        });
        const esJson = respuesta.headers.get("content-type")?.includes("application/json");
        const datos = esJson ? await respuesta.json() : null;

        if (!respuesta.ok) {
          throw new Error(
            (typeof datos?.error === "string" && datos.error) ||
            "No se pudo cargar el gasto. Inténtalo de nuevo."
          );
        }

        document.querySelector("#fecha").textContent = datos.fecha;
        document.querySelector("#importe").textContent = Number(datos.importe).toFixed(2);
        document.querySelector("#categoria").textContent = datos.categoria;
        document.querySelector("#descripcion").textContent =
          datos.descripcion || "Sin descripción";

        editar.href = editarUrl + sufijo;
        editar.hidden = false;
        detalle.hidden = false;
        estado.textContent = "";
      } catch (error) {
        estado.textContent =
          error instanceof TypeError || error instanceof SyntaxError
            ? "No se pudo cargar el gasto. Revisa tu conexión e inténtalo de nuevo."
            : error.message;
        estado.classList.add("error");
      }
    }

    cargarGasto();
  </script>
</body>
</html>
